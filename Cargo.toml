[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["The im authors"]
repository = "https://github.com/qjsoong/im"
homepage = "https://github.com/qjsoong/im"
readme = "README.md"
keywords = ["input-method", "pinyin", "shuangpin", "xim", "cli"]
categories = ["command-line-utilities", "internationalization"]

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
crossterm = "0.29.0"
ratatui = "0.30.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"
unicode-width = "0.2.2"
# `allow-unsafe-code` is deliberately *not* enabled: it drags in
# `as-raw-xcb-connection`, which links libxcb, and nothing here needs the FFI.
x11rb = "0.13.2"
xim = { version = "0.5.0", features = ["x11rb-server", "x11rb-client"] }

im-core = { path = "crates/im-core", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
