name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# No job here writes anything back to the repository.
permissions:
  contents: read

jobs:
  lints:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          # The action takes the toolchain from this input, not from the ref,
          # so the commit above pins only the action's own code.
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run tests
        run: cargo test --workspace --locked

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # This job is only worth running if it really is the old toolchain. A
      # dependency bump once silently pointed it at stable, which would have
      # made it a green check that checked nothing.
      - name: Assert the toolchain really is the MSRV
        run: |
          set -euo pipefail
          rustc --version
          if ! rustc --version | grep -q '^rustc 1\.89\.0'; then
            echo "::error::expected the 1.89.0 toolchain, got $(rustc --version)"
            exit 1
          fi
      - name: Check the workspace builds
        run: cargo check --workspace --all-targets --locked

  dictionary:
    name: Dictionary data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # `dict check` is offline: it validates the committed data file against
      # every rule the pipeline enforces, so a bad hand edit fails here.
      - name: Validate the committed dictionary
        run: cargo run --locked --release -p xtask -- dict check
      - name: Check the pipeline still compiles with clippy
        run: cargo clippy --locked -p xtask --all-targets -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build the docs, denying warnings
        run: cargo doc --workspace --no-deps --locked
