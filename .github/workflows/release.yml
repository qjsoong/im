name: Release

on:
  push:
    tags: ["v*"]
  # Lets the build half be exercised without publishing anything.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binary:
    name: Build a release binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # `x11rb` speaks the X11 protocol directly and needs no C libraries, so
      # this is a plain `cargo build` on a bare runner.
      - name: Build
        run: cargo build --release --locked -p im-cli -p im-xim

      - name: Package
        run: |
          set -euo pipefail
          target=x86_64-unknown-linux-gnu
          stage="im-${GITHUB_REF_NAME}-${target}"
          mkdir -p "$stage"
          cp target/release/im target/release/im-xim "$stage/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          cp -r data/dict "$stage/dict"
          tar czf "${stage}.tar.gz" "$stage"
          sha256sum ./*.tar.gz > SHA256SUMS

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ./*.tar.gz
            SHA256SUMS
