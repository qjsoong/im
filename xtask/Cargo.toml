[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false
description = "Development tasks for the im input method: dictionary data pipeline."

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

# The lints are repeated from the workspace instead of using
# `lints.workspace = true`, so this package also builds on its own, for
# example with `--manifest-path xtask/Cargo.toml`.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
