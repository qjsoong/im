[package]
name = "im-core"
description = "Schema-agnostic input method engine: dictionaries, code indexes and composition sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# Compile `data/dict/pinyin.tsv` into the binary so that `im` works with no
# data files installed. Front ends enable this; library users who bring their
# own dictionaries do not have to pay for it.
embed-dictionary = []

[lints]
workspace = true
