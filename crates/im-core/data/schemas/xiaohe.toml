# 小鹤双拼 (Flypy / Xiaohe double pinyin).
#
# Included mainly as evidence that a second scheme is a data change and not a
# code change: every difference from 自然码 lives in the three tables below.
id = "xiaohe"
name = "小鹤双拼"
description = "Flypy double pinyin. Two keys per syllable, for example 'hc' for 好."
kind = "syllable"
dictionaries = ["pinyin"]

[speller]
initials = [
    "b", "p", "m", "f", "d", "t", "n", "l", "g", "k", "h",
    "j", "q", "x", "r", "z", "c", "s", "y", "w",
    "zh", "ch", "sh",
]

[speller.initial_keys]
zh = "v"
ch = "i"
sh = "u"

[speller.finals]
a = "a"
o = "o"
e = "e"
i = "i"
