[package]
name = "im-cli"
description = "The im command line interface: a terminal candidate picker and query tool for the im input method"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "im"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true, features = ["use-dev-tty"] }
im-core = { workspace = true, features = ["embed-dictionary"] }
ratatui = { workspace = true }
unicode-width = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
